# This file is managed by Ansible

reporting-disabled = true
bind-address = "127.0.0.1:8088"
hardening-enabled = false

[meta]
  dir = "/var/lib/influxdb/meta"
  retention-autocreate = true
  logging-enabled = true

[data]
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"
  wal-fsync-delay = "0s"
  index-version = "inmem"
  trace-logging-enabled = false
  query-log-enabled = true
  ingress-metric-by-measurement-enabled = false
  ingress-metric-by-login-enabled = false
  strict-error-handling = false
  validate-keys = false
  cache-max-memory-size = "1g"
  cache-snapshot-memory-size = "25m"
  cache-snapshot-write-cold-duration = "10m"
  compact-full-write-cold-duration = "4h"
  max-concurrent-compactions = 0
  max-concurrent-deletes = 1
  compact-throughput = "48m"
  compact-throughput-burst = "48m"
  aggressive-points-per-block = 10000
  tsm-use-madv-willneed = false
  max-series-per-database = 1000000
  max-values-per-tag = 100000
  max-index-log-file-size = "1m"
  series-id-set-cache-size = 100
  series-id-set-cache-max-size = 0
  series-id-set-cache-target-hit-rate = 0.0
  series-id-set-cache-shrink-conservatism = 2.5
  tar-stream-buffer-size = 1048576

[coordinator]
  write-timeout = "10s"
  max-concurrent-queries = 0
  query-timeout = "0s"
  log-queries-after = "0s"
  log-timedout-queries = false
  max-select-point = 0
  max-select-series = 0
  max-select-buckets = 0
  termination-query-log = false

[retention]
  enabled = true
  check-interval = "30m0s"

[shard-precreation]
  enabled = true
  check-interval = "10m0s"
  advance-period = "30m0s"

[monitor]
  store-enabled = true
  store-database = "_internal"
  store-interval = "10s"

[http]
  enabled = true
  flux-enabled = false
  flux-log-enabled = false
  bind-address = ":8086"
  auth-enabled = true
  realm = "InfluxDB"
  log-enabled = true
  suppress-write-log = false
  access-log-path = ""
  access-log-status-filters = []
  write-tracing = false
  pprof-enabled = true
  pprof-auth-enabled = false
  debug-pprof-enabled = false
  ping-auth-enabled = false
  prom-read-auth-enabled = false
  https-enabled = false
  https-certificate = "/etc/ssl/influxdb.pem"
  https-private-key = ""
  https-insecure-certificate = false
  https-ignore-sanity-checks = false
  https-client-auth-type = "RequireAndVerifyClientCert"
  https-client-ca = { paths = ["/etc/ssl/client-ca.pem"], include-system = false }
  shared-secret = ""
  max-row-limit = 0
  max-connection-limit = 0
  unix-socket-enabled = false
  bind-socket = "/var/run/influxdb.sock"
  max-body-size = 25000000
  max-concurrent-write-limit = 0
  max-enqueued-write-limit = 0
  enqueued-write-timeout = 0
  user-query-bytes-enabled = false
  user-write-bytes-enabled = false

[logging]
  format = "auto"
  level = "info"
  suppress-logo = false

[subscriber]
  enabled = true
  http-timeout = "30s"
  insecure-skip-verify = false
  ca-certs = ""
  root-ca = { paths = ["/etc/ssl/subscriber-ca.pem"], include-system = false }
  private-key = ""
  insecure-certificate = false
  ignore-cert-sanity-checks = false
  write-concurrency = 40
  write-buffer-size = 1000

[continuous_queries]
  enabled = true
  log-enabled = true
  query-stats-enabled = false
  run-interval = "1s"
