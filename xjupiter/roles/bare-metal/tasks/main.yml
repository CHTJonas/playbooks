---
- name: Install common packages for bare metal machines
  ansible.builtin.apt:
    install_recommends: no
    update_cache: yes
    cache_valid_time: 3600
    pkg:
      - smartmontools

- name: Install Intel microcode for bare metal machines
  ansible.builtin.apt:
    install_recommends: no
    update_cache: yes
    cache_valid_time: 3600
    pkg:
      - intel-microcode
  when: "'GenuineIntel' in ansible_facts['processor']"

- name: Install AMD microcode for bare metal machines
  ansible.builtin.apt:
    install_recommends: no
    update_cache: yes
    cache_valid_time: 3600
    pkg:
      - amd64-microcode
  when: "'AuthenticAMD' in ansible_facts['processor']"
