#!/usr/sbin/nft -f
# This file is managed by Ansible

flush ruleset

table inet filter {
	chain inbound_ipv4 {
		icmp type echo-request limit rate 10/second burst 30 packets accept
		icmp type { echo-reply, destination-unreachable, time-exceeded } accept
	}

	chain inbound_ipv6 {
		icmpv6 type echo-request limit rate 10/second burst 30 packets accept
		icmp type { echo-reply, destination-unreachable, time-exceeded } accept
		icmpv6 type { packet-too-big, parameter-problem } accept
		ip6 saddr fe80::/10 ip6 hoplimit 255 icmpv6 type {
			nd-router-advert,
			nd-neighbor-solicit,
			nd-neighbor-advert
		} accept
		ip6 saddr :: ip6 hoplimit 255 icmpv6 type nd-neighbor-solicit accept
		ip6 saddr { ::, fe80::/10 } ip6 hoplimit 1 icmpv6 type {
			mld-listener-query,
			mld-listener-report,
			mld-listener-reduction,
			mld2-listener-report
		} accept
	}

	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state vmap { established: accept, related: accept, invalid: drop }
		meta protocol vmap { ip: jump inbound_ipv4, ip6: jump inbound_ipv6 }
		tcp dport 22 accept
		udp dport 60000-61000 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

include "/etc/nftables/*.conf"
